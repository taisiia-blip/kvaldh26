<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           //Vaadake, milliseid ameteid (P106) on Wikidatas
           //Võimaldage teisest rippmenüüst valida ametit
           // (uuel lehel)
           let lause=`
             SELECT ?item ?itemLabel
              WHERE
              {
                ?item wdt:P27 wd:${riik.value}. 
                ?item wdt:P106 wd:${amet.value}.
              
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
                } 
              }
              LIMIT 10
           `;
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);  
           vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva);
        }

function kool(){
  let lause2=`SELECT ?kool ?koolLabel (COUNT(*) as ?kogus) {
  ?isik wdt:P27 wd:Q191.
  ?isik wdt:P106 wd:Q82955.
  ?isik wdt:P69 ?kool.
  
  SERVICE wikibase:label {
    bd:serviceParam wikibase:language "et,en".
  } 

} GROUP BY ?kool ?koolLabel
 ORDER BY DESC(?kogus)
`;
  let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause2);  
           vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva2);
}
       function kuva2(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause2);
           }
        }
       
        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
  </head>
  <body>
     <select id="riik" onchange="kysi()">
        <option value="Q33">Soome</option>
        <option value="Q191">Eesti</option>
        <option value="Q34">Rootsi</option>
     </select>
     <select id="amet" onchange="kysi()">
      <option value="Q193391">diplomaat</option>
      <option value="Q333634">tõlkija</option>
      <option value="Q201788">ajaloolane</option>
      <option value="Q82955">poliitik</option>
     </select>

    <select id="kool" onchange="kool()">
      <option value="P69">kool</option>
     <input type="button" value="otsi" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
