<!doctype html>
<head>
  <title>Kuulsad kassid</title>
  <script>
    function kysi() {
      // Kuulsad kassid
      let lause = `
        SELECT DISTINCT ?item ?itemLabel
        WHERE {
          ?item wdt:P31 wd:Q146.

          SERVICE wikibase:label {
            bd:serviceParam wikibase:language "en".
          }
        }
        LIMIT 50
      `;

      saadaPäring(lause);
    }

    function kysi2() {
      // Kassid valitud ametiga
      let lause = `
        SELECT DISTINCT ?item ?itemLabel
        WHERE {
          ?item wdt:P31 wd:Q146.
          ?item wdt:P106 wd:Q2045208.

          SERVICE wikibase:label {
            bd:serviceParam wikibase:language "en".
          }
        }
        LIMIT 50
      `;

      saadaPäring(lause);
    }

    function kysi3() {
      // Isased kassid
      let lause = `
        SELECT DISTINCT ?item ?itemLabel
        WHERE {
          ?item wdt:P31 wd:Q146.
          ?item wdt:P21 wd:Q6581097.

          SERVICE wikibase:label {
            bd:serviceParam wikibase:language "en".
          }
        }
        LIMIT 50
      `;

      saadaPäring(lause);
    }

    function saadaPäring(lause) {
      let aadress =
        "https://query.wikidata.org/sparql?format=json&query=" +
        encodeURIComponent(lause);

      fetch(aadress, {
        headers: {
          "Accept": "application/sparql-results+json"
        }
      })
        .then(vastus => {
          if (!vastus.ok) {
            throw new Error("Päringu viga: " + vastus.status);
          }
          return vastus.json();
        })
        .then(kuva)
        .catch(viga => {
          console.error(viga);
          document.getElementById("vastus").textContent =
            "Andmete laadimine ebaõnnestus: " + viga.message;
        });
    }

    function kuva(d) {
     function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
      }

      if (d.results.bindings.length === 0) {
        vastus.textContent = "Tulemusi ei leitud.";
      }
    }
  </script>
</head>

<body>
  <button onclick="kysi()">Kuulsad kassid</button>
  <button onclick="kysi2()">Kassid ametiga</button>
  <button onclick="kysi3()">Isased kassid</button>

  <ul id="vastus"></ul>
</body>
</html>
