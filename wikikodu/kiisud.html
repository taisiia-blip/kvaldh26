<!doctype html>
<html>
  <head>
     <script>
        function kysi(){  //kuulsad kassid
           let lause=´SELECT ?item ?itemLabel
 WHERE
{
?item wdt:P31 wd:Q146. 
?item wdt:P106 wd:Q2045208.
              
SERVICE wikibase:label {bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".}´
};
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);      
           fetch(aadress).then(d => d.json()).then(kuva);
        }

        function kysi2(){
           let lause=`
            SELECT ?item ?itemLabel
WHERE {
  ?item wdt:P31 wd:Q146.
  ?item wdt:P106 wd:Q2045208.
  ?item wdt:P21 wd:Q44148.

   function kysi3(){ 
           let lause=`
            SELECT ?item ?itemLabel
WHERE {
  ?item wdt:P31 wd:Q146.
  ?item wdt:P106 wd:Q2045208.
  ?item wdt:P21 wd:Q43445.

  SERVICE wikibase:label {
    bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
  }
}`;
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);      
           fetch(aadress).then(d => d.json()).then(kuva);
        }


       
        function kuva(d){
           console.log(d);
           vastus.textContent="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              vastus.textContent+=" "+rida["itemLabel"]["value"];
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>

  <body>
     <input type="button" value="kuulsad kassid" onclick="kysi()" />
     <input type="button" value="kass" onclick="kysi2()" />
