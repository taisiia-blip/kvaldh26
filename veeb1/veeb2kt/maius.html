
<!DOCTYPE html>
<html>

<head>

      <style>
        body {
    background-color: #ff4fb9;

            img {
            width: 200px;

    <script>
        function arvutus() {
            vastus.innerText = (kogus.valueAsNumber * 1) + " tuhat miljard maiust";
        }
    </script>
</head>

<body>
            Kusti näeb täna väga nunnu välja, mitu maiustust ma annan talle?<br/>

    <input type="number" id="kogus">
    <input type="button" value="arvuta" onclick="arvutus()">
    <span id="vastus">vastuse koht</span>
    <br><br>
    <img src="maius.jpg"> 
    
    

</body>
